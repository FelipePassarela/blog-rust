repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: cargo-test
        name: cargo test
        entry: cargo test -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
